<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4 - FPT Education</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 0;
            margin: 0;
        }
        .header {
            background-color: #ff9800;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        .nav-header {
            display: flex;
            gap: 20px;
            color: white;
        }
        .nav-header a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }
        .container-main {
            background-color: #fff;
            padding: 40px;
            text-align: center;
        }
        .title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .subtitle {
            font-size: 48px;
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 20px;
        }
        .content-section {
            margin: 30px 0;
            text-align: left;
        }
        .content-section h3 {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .content-section p {
            color: #666;
        }
        .footer {
            background-color: #f4d47a;
            padding: 20px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <div class="logo">FPT Education</div>
        </div>
        <div class="nav-header">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <div class="container-main">
        <div class="title">FPT UNIVERSITY</div>
    </div>

    <div class="container" style="padding: 40px 20px;">
        <div class="content-section">
            <h3>About</h3>
            <p>This is the about section of the website.</p>
        </div>
        <div class="content-section">
            <h3>Contact</h3>
            <p>For any inquiries, please contact us at example@example.com</p>
        </div>
    </div>

    <div class="footer">
        © 2023 Website. All rights reserved.
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
