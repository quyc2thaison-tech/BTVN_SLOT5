<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1 - Bootstrap Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
        }
        .header {
            background-color: #e9ecef;
            padding: 30px;
            margin-bottom: 20px;
            text-align: left;
        }
        .grid-wrapper {
            background-color: #d3d3d3;
            padding: 20px;
            border-radius: 8px;
        }
        .grid-item {
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            padding: 16px;
            text-align: center;
            margin-bottom: 10px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .footer {
            background-color: #d3d3d3;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Let's test the grid!</h2>
    </div>

    <div class="container-fluid grid-wrapper">
        <div class="row g-2 mb-2">
            <div class="col-md-4">
                <div class="grid-item">First col</div>
            </div>
            <div class="col-md-8">
                <div class="grid-item">Second col</div>
            </div>
        </div>
        <div class="row g-2 mb-2">
            <div class="col-md-3">
                <div class="grid-item">col</div>
            </div>
            <div class="col-md-6">
                <div class="grid-item">col</div>
            </div>
            <div class="col-md-3">
                <div class="grid-item">col</div>
            </div>
        </div>
        <div class="row g-2">
            <div class="col-md-3">
                <div class="grid-item">col</div>
            </div>
            <div class="col-md-3">
                <div class="grid-item">col</div>
            </div>
            <div class="col-md-3">
                <div class="grid-item">col</div>
            </div>
            <div class="col-md-3">
                <div class="grid-item">col</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <h4>Created by ABC!</h4>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
