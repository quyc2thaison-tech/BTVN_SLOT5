<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2 - Bootstrap Logos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
        }
        .header {
            background-color: #e9ecef;
            padding: 50px;
            margin-bottom: 30px;
            text-align: center;
        }
        .logos {
            text-align: center;
            padding: 40px 0;
        }
        .logo {
            margin: 0 20px;
            display: inline-block;
        }
        .logo img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>My First Bootstrap Page</h2>
    </div>

    <div class="logos">
        <div class="logo">
            <img src="https://www.w3schools.com/whatis/img_html5.jpg" alt="HTML5">
        </div>
        <div class="logo">
            <img src="https://www.w3schools.com/whatis/img_css3.jpg" alt="CSS3">
        </div>
        <div class="logo">
            <img src="https://getbootstrap.com/docs/5.0/assets/brand/bootstrap-logo.svg" alt="Bootstrap">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
