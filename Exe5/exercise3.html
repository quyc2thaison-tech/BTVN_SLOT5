<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3 - Bootstrap Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
        }
        .header {
            background-color: #e9ecef;
            padding: 30px;
            margin-bottom: 20px;
            text-align: left;
        }
        .nav-links {
            margin-bottom: 20px;
        }
        .nav-links a {
            margin-right: 20px;
            text-decoration: none;
        }
        .table-custom {
            border: 1px solid #ccc;
            width: 100%;
        }
        .table-custom th, .table-custom td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        .footer {
            background-color: #d3d3d3;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Let's test the grid!</h2>
    </div>

    <div class="nav-links">
        <a href="#" class="text-primary">Active</a>
        <a href="#" class="text-primary">Link</a>
        <a href="#" class="text-primary">Link</a>
        <a href="#" class="text-secondary">Disabled</a>
    </div>

    <div class="container-fluid">
        <table class="table-custom">
            <thead>
                <tr>
                    <th colspan="3">First col</th>
                    <th colspan="2">Second col</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>col</td>
                    <td>col</td>
                    <td>col</td>
                    <td>col</td>
                    <td></td>
                </tr>
                <tr>
                    <td>col</td>
                    <td>col</td>
                    <td>col</td>
                    <td>col</td>
                    <td>col</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        <h4>Created by ABC!</h4>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
