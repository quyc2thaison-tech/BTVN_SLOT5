<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 7 - Cards Column</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f7fb;
            color: #1f2937;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            line-height: 1.65;
        }
        .page-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 16px 48px;
        }
        .page-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.03em;
        }
        .section-label {
            font-size: 1.1rem;
            font-style: italic;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .page-card {
            background: #ffffff;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.05);
            padding: 26px;
            margin-bottom: 28px;
        }
        .section-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 18px;
        }
        .cards-columns {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
        }
        .card-box {
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 18px 35px rgba(15, 23, 42, 0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card-box:hover {
            transform: translateY(-6px);
            box-shadow: 0 22px 45px rgba(15, 23, 42, 0.12);
        }
        .card-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }
        .card-body {
            padding: 18px 16px 20px;
            text-align: center;
        }
        .card-body p {
            margin: 0;
            font-size: 0.96rem;
            color: #ffffff;
        }
        .card-blue { background: #2563eb; }
        .card-gold { background: #f59e0b; }
        .card-red { background: #dc2626; }
        .card-box .card-body {
            background: rgba(0,0,0,0.08);
        }
        .cards-header {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 18px;
        }
        .conclusion-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .conclusion-text {
            color: #4b5563;
        }
        @media (max-width: 960px) {
            .cards-columns { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 640px) {
            .page-container { padding: 24px 12px 36px; }
            .cards-columns { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <header>
            <h1 class="page-title">Exercise 7: Demo about Cards Column</h1>
        </header>

        <section class="page-card">
            <div class="section-title">Exercises</div>
            <div class="cards-header">Cards Columns</div>
            <div class="cards-columns">
                <div class="card-box card-blue">
                    <img class="card-image" src="picture/Screenshot 2026-05-31 193828.png" alt="Card image">
                    <div class="card-body">
                        <p>Some text inside the first card</p>
                    </div>
                </div>
                <div class="card-box card-gold">
                    <img class="card-image" src="picture/Screenshot 2026-05-31 193828.png" alt="Card image">
                    <div class="card-body">
                        <p>Some text inside the first card</p>
                    </div>
                </div>
                <div class="card-box card-red">
                    <img class="card-image" src="picture/Screenshot 2026-05-31 193828.png" alt="Card image">
                    <div class="card-body">
                        <p>Some text inside the first card</p>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
